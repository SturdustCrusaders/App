# Docker Compose file for running paperless from the Docker Hub.
# This file contains everything paperless needs to run.
# Paperless supports amd64, arm and arm64 hardware.
#
# All compose files of paperless configure paperless in the following way:
#
# - Paperless is (re)started on system boot, if it was running before shutdown.
# - Docker volumes for storing data are managed by Docker.
# - Folders for importing and exporting files are created in the same directory
#   as this file and mounted to the correct folders inside the container.
# - Paperless listens on port 8000.
#
# In addition to that, this Docker Compose file adds the following optional
# configurations:
#
# - Instead of SQLite (default), PostgreSQL is used as the database server.
#
# To install and update paperless with this file, do the following:
#
# - Copy this file as 'docker-compose.yml' and the files 'docker-compose.env'
#   and '.env' into a folder.
# - Run 'docker compose pull'.
# - Run 'docker compose up -d'.
#
# For more extensive installation and update instructions, refer to the
# documentation.
services:
  broker:
    image: docker.io/library/redis:8
    restart: unless-stopped
    volumes:
      - redisdata:/data
  db:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "8000:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
      - ../src/documents/models.py:/usr/src/paperless/src/documents/models.py
      - ../src/documents/ai_extraction.py:/usr/src/paperless/src/documents/ai_extraction.py
      - ../src/documents/word_storage.py:/usr/src/paperless/src/documents/word_storage.py
      - ../src/documents/template_processor.py:/usr/src/paperless/src/documents/template_processor.py
      - ../src/documents/apps.py:/usr/src/paperless/src/documents/apps.py
      - ../src/documents/consumer.py:/usr/src/paperless/src/documents/consumer.py
      - ../src/documents/permissions.py:/usr/src/paperless/src/documents/permissions.py
      - ../src/documents/filters.py:/usr/src/paperless/src/documents/filters.py
      - ../src/documents/views.py:/usr/src/paperless/src/documents/views.py
      - ../src/documents/template_utils.py:/usr/src/paperless/src/documents/template_utils.py
      - ../src/documents/serialisers.py:/usr/src/paperless/src/documents/serialisers.py
      - ../src/documents/migrations/1076_add_ai_word_extraction.py:/usr/src/paperless/src/documents/migrations/1076_add_ai_word_extraction.py
      - ../src/documents/migrations/1077_documenttypetemplate_and_fields.py:/usr/src/paperless/src/documents/migrations/1077_documenttypetemplate_and_fields.py
      - ../src/documents/migrations/1078_default_groups.py:/usr/src/paperless/src/documents/migrations/1078_default_groups.py
    env_file: docker-compose.env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
volumes:
  data:
  media:
  pgdata:
  redisdata:
